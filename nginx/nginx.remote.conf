events {}

http {
    log_format aula '$remote_addr host=$host "$request" status=$status '
                    'policy=$lb_policy upstream=$upstream_addr '
                    'tempo=$request_time upstream_tempo=$upstream_response_time';
    access_log /var/log/nginx/access.log aula;

    upstream pool_round_robin {
        server app1:8000 max_fails=1 fail_timeout=10s;
        server app2:8000 max_fails=1 fail_timeout=10s;
        server app3:8000 max_fails=1 fail_timeout=10s;
    }

    upstream pool_weighted {
        server app1:8000 weight=3 max_fails=1 fail_timeout=10s;
        server app2:8000 weight=1 max_fails=1 fail_timeout=10s;
        server app3:8000 weight=1 max_fails=1 fail_timeout=10s;
    }

    upstream pool_least_connections {
        least_conn;
        server app1:8000 max_fails=1 fail_timeout=10s;
        server app2:8000 max_fails=1 fail_timeout=10s;
        server app3:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        location = / {
            try_files /index.html =404;
        }

        location /rr/ {
            set $lb_policy round-robin;
            proxy_pass http://pool_round_robin/;
            include /etc/nginx/proxy-common.conf;
            add_header X-LB-Policy $lb_policy always;
        }

        location /weighted/ {
            set $lb_policy weighted-3-1-1;
            proxy_pass http://pool_weighted/;
            include /etc/nginx/proxy-common.conf;
            add_header X-LB-Policy $lb_policy always;
        }

        location /least/ {
            set $lb_policy least-connections;
            proxy_pass http://pool_least_connections/;
            include /etc/nginx/proxy-common.conf;
            add_header X-LB-Policy $lb_policy always;
        }

        location = /status {
            default_type application/json;
            return 200 '{"status":"ok","entrypoint":"port 80"}';
        }
    }
}

