upstream pool_round_robin {
    zone pool_round_robin 64k;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=10s;
}

upstream pool_weighted {
    zone pool_weighted 64k;
    server 127.0.0.1:8001 weight=3 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 weight=1 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8003 weight=1 max_fails=1 fail_timeout=10s;
}

upstream pool_least_connections {
    zone pool_least_connections 64k;
    least_conn;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/dns-lb-lab/www;
    access_log /var/log/nginx/dns-lb-access.log;
    error_log /var/log/nginx/dns-lb-error.log;

    location = / {
        try_files /index.html =404;
    }

    location /rr/ {
        set $lb_policy round-robin;
        proxy_pass http://pool_round_robin/;
        include /etc/nginx/dns-lb-proxy-common.conf;
        add_header X-LB-Policy $lb_policy always;
    }

    location /weighted/ {
        set $lb_policy weighted-3-1-1;
        proxy_pass http://pool_weighted/;
        include /etc/nginx/dns-lb-proxy-common.conf;
        add_header X-LB-Policy $lb_policy always;
    }

    location /least/ {
        set $lb_policy least-connections;
        proxy_pass http://pool_least_connections/;
        include /etc/nginx/dns-lb-proxy-common.conf;
        add_header X-LB-Policy $lb_policy always;
    }

    location = /status {
        default_type application/json;
        return 200 '{"status":"ok","entrypoint":"port 80","mode":"native"}';
    }
}
