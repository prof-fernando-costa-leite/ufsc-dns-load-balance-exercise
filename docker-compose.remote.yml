services:
  app1:
    image: python:3.13-alpine
    environment:
      INSTANCE: app-1
    command: ["python", "/app/server.py"]
    volumes:
      - ./app/server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: unless-stopped
    networks: [lab]

  app2:
    image: python:3.13-alpine
    environment:
      INSTANCE: app-2
    command: ["python", "/app/server.py"]
    volumes:
      - ./app/server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: unless-stopped
    networks: [lab]

  app3:
    image: python:3.13-alpine
    environment:
      INSTANCE: app-3
    command: ["python", "/app/server.py"]
    volumes:
      - ./app/server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: unless-stopped
    networks: [lab]

  load-balancer:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    ports:
      - "${LAB_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.remote.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./www:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
    driver: bridge
